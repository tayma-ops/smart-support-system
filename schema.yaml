  /api/tickets/:
    get:
      operationId: api_tickets_list
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
          enum:
          - account
          - billing
          - complaint
          - delivery
          - general
          - other
          - technical
        description: |-
          * `technical` - Technical issue
          * `billing` - Billing
          * `delivery` - Delivery
          * `account` - Account
          * `complaint` - Complaint
          * `general` - General inquiry
          * `other` - Other
      - in: query
        name: created_after
        schema:
          type: string
          format: date
        description: Created from
      - in: query
        name: created_before
        schema:
          type: string
          format: date
        description: Created through
      - in: query
        name: department
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
          - urgent
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `urgent` - Urgent
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - closed
          - in_progress
          - open
          - resolved
          - waiting
        description: |-
          * `open` - Open
          * `in_progress` - In progress
          * `waiting` - Waiting for customer
          * `resolved` - Resolved
          * `closed` - Closed
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketList'
          description: ''
