            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
        required: true
